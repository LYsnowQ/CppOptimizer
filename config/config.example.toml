version = "1.0.0"          # 三段数字；可带预发布标识（如 "1.2.0-beta.1"）；旧式整数仍兼容

[application]
mode = "observe"              # observe / balanced / experimental
safe_mode_on_recovery_error = true   # 上次异常退出且未确认时是否暂停 Agent 受理；
                                      # false = 不阻断，但该事实仍会写入日志/横幅/审计（可见性不可关闭）

[logging]
level = "info"
directory = ""                # 空表示使用 LocalAppData 下的默认目录
max_file_mb = 10
max_files = 5                 # 保留的历史文件数上限（不含当前文件；磁盘上至多 6 个）
console = true

[agent]
form = "startup_tray"          # 常驻形态（**声明的意图**，不会自动注册）：
                               #   startup_tray = 登录后随用户会话拉起启动项 + 托盘常驻（默认；标准用户、无提权）；
                               #   task         = 计划任务（登录触发；注册需管理员，任务本身不提权）；
                               #   service      = SCM 服务（安装需管理员；Session 0，无托盘界面）。
                               # 注册始终是显式命令（--agent-form install <form>，一次性 UAC）；
                               # 配置只表达选择，不会自动安装或提权；未配置时回到默认 startup_tray。

[layers]
monitoring = true
maintenance = false
emergency = false

[power]
execution_required = true
display_required = false
switch_power_scheme = false    # R2：默认关闭

[priority]
enabled = false
max_level = "above_normal"     # none / above_normal / high；无 realtime

[memory]
query_enabled = true
scheduled_clean_enabled = false
allow_native_write = false     # R3：默认关闭
max_clean_level = "light"

[gpu_heartbeat]
enabled = false                # R3 Experimental
max_measured_load_percent = 1.0

[scheduler]
enabled = false                # Experimental

[disk_cache]
enabled = false                # Planned

[policy]
comfortable_margin_percent = 30  # 余量 > 30% -> Comfortable
adequate_margin_percent = 15     # 余量 > 15% -> Adequate
tight_margin_percent = 5         # 余量 > 5% -> Tight；否则 Critical
cooldown_ms = 5000               # 决策防抖冷却期（毫秒），>= 0
user_away_idle_seconds = 0       # 用户在场门禁（ACT-004）：0 = 关闭（保守默认）；>0 秒无键鼠输入
                                 #   视用户不在场（AFK/锁屏/断开），抑制优化建议（NoOp user_away）
halt_after_action_failures = 0   # R1 动作连续失败停摆（IPC-017）：0 = 关闭（保守默认）；>0 次连续
                                 #   优先级/电源动作失败后执行器停摆（不再触碰系统，决策保持纯咨询）

[ipc]
safe_mode_enabled = true         # Agent 受理门禁开关（false = 关闭 Safe Mode）
safe_mode_failures = 3           # 时间窗口内身份/凭据失败阈值（1..100）
safe_mode_window_ms = 5000       # 计数窗口（毫秒，1..600000）
safe_mode_cooldown_ms = 2000     # 进入 Safe Mode 后的冷却期（毫秒，1..600000）

# 每个游戏规则必须有稳定 id。实际生产配置建议同时限制完整安装路径。
[[games]]
id = "example-game"
display_name = "Example Game"
process_names = ["ExampleGame.exe"]
window_title_contains = ""   # 窗口标题子串过滤（空 = 仅按进程名匹配；非空时主窗口标题须含
                                 #   该子串才命中规则，供同名多开/启动器与游戏同进程名场景挑选实例）
pause_when_background = true
